version: '1.0.10.3'

services:
  app_proxy:
    environment:
      APP_HOST: youseffo13-playit_server_1
      APP_PORT: 8008
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: on-failure
    network_mode: host
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
