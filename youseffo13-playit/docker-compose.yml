version: '1.0.10.1'

services:
  app_proxy:
    environment:
      APP_HOST: youseffo13-playit_server_1
      APP_PORT: 8008
      PROXY_AUTH_ADD: "false"

  server:
    image: wisdomsky/playit-docker-web:latest
    restart: on-failure
    network_mode: host
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
